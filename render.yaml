services:
  - type: web
    name: campus-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-31b-it
      - key: ALLOWED_ORIGINS
        value: https://saidn-dev.github.io
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
